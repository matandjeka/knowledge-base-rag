[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-fusion-rag"
version = "0.1.0"
description = "A multi-source enterprise retrieval-augmented generation platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "faiss-cpu>=1.10,<1.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "faiss-cpu>=1.12,<2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "httpx>=0.28,<1",
    "numpy>=1.26,<2",
    "openai>=1.101,<3",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.21,<1",
    "sqlglot>=27.10,<29",
    "pymupdf>=1.26,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pinecone>=9,<10",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=3.4,<4",
    "streamlit>=1.48,<2",
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.41,<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "trafilatura>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rag-evaluate = "app.evaluation.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "live_openai: opt-in graph extraction test that calls the configured OpenAI API",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".claude", "context", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "ui", "tests"]

[[tool.mypy.overrides]]
module = ["faiss.*", "sentence_transformers.*", "streamlit.*", "trafilatura.*"]
ignore_missing_imports = true
follow_imports = "skip"
